<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check Mate Suite</title>
<meta name="description" content="Check Mate, Ημερολόγιο και V.C. Tips σε ένα σημείο.">
<meta name="theme-color" content="#d4e6fa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CM Suite">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Commissioner:wght@500;700&display=swap">
<style>
  :root{
    --bg:#ffffff; --blue:#2a7fd4; --orange:#f0821e; --line:#a9c9ec; --muted:#6b7a90; --ink:#14213a;
  }
  *{box-sizing:border-box}
  html{background:#e2eefb}
  html,body{margin:0;min-height:100%}
  body{background:radial-gradient(90% 55% at 50% 22%,rgba(255,255,255,.85) 0%,rgba(255,255,255,0) 70%),linear-gradient(165deg,#d4e6fa 0%,#e6f0fc 50%,#fbe6d2 100%) fixed}
  body{
    color:var(--ink);
    font-family:"Commissioner",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:calc(env(safe-area-inset-top) + 32px) 16px calc(env(safe-area-inset-bottom) + 24px);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
  }
  main{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding-bottom:6vh}

  .logo{display:flex;flex-direction:column;align-items:center;text-align:center}
  .emblem{width:min(42vw,180px);height:auto;display:block}
  .word{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;color:var(--blue);
        font-size:clamp(2.6rem,12vw,3.6rem);line-height:1;margin:14px 0 6px;letter-spacing:-.5px}
  .suite{display:flex;align-items:center;gap:14px;font-family:"Fredoka",system-ui,sans-serif;font-weight:600;
         color:var(--orange);font-size:clamp(1.1rem,5vw,1.45rem);letter-spacing:.42em}
  .suite span{margin-right:-.42em}
  .suite i{display:block;width:clamp(48px,16vw,84px);height:3px;border-radius:3px;background:var(--orange)}
  .greet{margin-top:20px;color:var(--muted);font-size:.92rem}

  .apps{display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr;align-items:center;width:100%;margin-top:40px}
  .sep{width:1px;height:70%;background:var(--line);justify-self:center}
  a.app{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 4px;text-decoration:none;
        color:var(--blue);border-radius:18px;-webkit-tap-highlight-color:transparent;transition:transform .12s ease, background .12s ease}
  a.app:hover{background:rgba(255,255,255,.6)}
  a.app:active{transform:scale(.95)}
  a.app:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
  a.app img{width:clamp(72px,22vw,96px);height:auto;aspect-ratio:1;border-radius:22%;
            box-shadow:0 4px 14px rgba(20,33,58,.14)}
  .name{font-weight:700;font-size:clamp(.95rem,4.2vw,1.12rem);text-align:center;line-height:1.2}

  .install{margin-top:34px;display:none;width:100%;max-width:360px;border:0;border-radius:14px;padding:14px;
           background:var(--orange);color:#fff;font:700 1rem "Commissioner",system-ui,sans-serif;cursor:pointer}
  .hint{display:none;margin-top:26px;color:var(--muted);font-size:.88rem;text-align:center;line-height:1.5;max-width:360px}

  [hidden]{display:none!important}
  .loading{margin-top:36px;color:var(--muted);text-align:center;max-width:360px}
  .user{margin-top:6px;color:var(--ink);font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
  .user button{border:1px solid #d6e3f3;background:#fff;color:var(--blue);border-radius:999px;padding:5px 12px;font:600 .82rem "Commissioner",system-ui,sans-serif;cursor:pointer}
  .user button:hover{background:#f2f7fd}

  .auth{width:100%;max-width:360px;margin-top:34px;display:flex;flex-direction:column;gap:12px}
  .auth .lead{margin:0;color:var(--muted);text-align:center;font-size:.95rem;line-height:1.45}
  .auth label{display:flex;flex-direction:column;gap:5px;font-size:.88rem;font-weight:600;color:var(--ink)}
  .auth input{font:500 1rem "Commissioner",system-ui,sans-serif;padding:12px 14px;border:1px solid #cdd8e8;border-radius:12px;background:#fff;color:var(--ink)}
  .auth input:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
  .btn{border:0;border-radius:12px;padding:13px;font:700 1rem "Commissioner",system-ui,sans-serif;cursor:pointer}
  .btn.primary{background:var(--blue);color:#fff}
  .btn.primary:disabled{opacity:.6;cursor:default}
  .btn.google{background:#fff;color:var(--ink);border:1px solid #cdd8e8;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600}
  .link{background:none;border:0;color:var(--blue);font:600 .9rem "Commissioner",system-ui,sans-serif;cursor:pointer;padding:4px;text-align:center;text-decoration:none}
  .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
  .or::before,.or::after{content:"";flex:1;height:1px;background:#dfe6f0}
  .msg{padding:10px 12px;border-radius:10px;font-size:.9rem;line-height:1.4}
  .msg.err{background:#fdecec;color:#a12626}
  .msg.ok{background:#e8f6ee;color:#1d6b47}
  .foot{color:var(--muted);font-size:.86rem;text-align:center;margin-top:4px}


  /* compact sign-in screen */
  body.signin{padding-top:calc(env(safe-area-inset-top) + 18px);padding-bottom:calc(env(safe-area-inset-bottom) + 14px)}
  body.signin main{padding-bottom:0}
  body.signin .emblem{width:min(22vw,84px)}
  body.signin .word{font-size:clamp(1.7rem,8vw,2.2rem);margin:8px 0 4px}
  body.signin .suite{font-size:clamp(.85rem,3.6vw,1rem);gap:10px}
  body.signin .suite i{width:clamp(32px,10vw,52px);height:2px}
  body.signin .auth{margin-top:18px;gap:9px;max-width:340px}
  body.signin .auth .lead{font-size:.88rem}
  body.signin .auth label{font-size:.82rem;gap:4px}
  body.signin .auth input{padding:9px 12px;font-size:.95rem;border-radius:10px}
  body.signin .btn{padding:10px;font-size:.95rem;border-radius:10px}
  body.signin .or{font-size:.8rem}
  body.signin .foot{font-size:.8rem;margin-top:0}
</style>
</head>
<body>
<main>
  <div class="logo" role="img" aria-label="Check Mate Suite">
    <svg class="emblem" viewBox="0 0 52 50" aria-hidden="true">
      <circle cx="24" cy="26" r="23" fill="#2a7fd4"/>
      <rect x="9" y="18" width="22" height="16" rx="3" fill="#fff"/>
      <path d="M31 23 L39 19 V33 L31 29 Z" fill="#fff"/>
      <circle cx="20" cy="26" r="5" fill="#2a7fd4"/>
      <circle cx="20" cy="26" r="2" fill="none" stroke="#fff" stroke-width="2.5"/>
      <path d="M33 40 L39 46 L49 32" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M33 40 L39 46 L49 32" fill="none" stroke="#f0821e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="word">Check Mate</div>
    <div class="suite"><i></i><span>SUITE</span><i></i></div>
  </div>

  <div class="loading" id="loading">Φόρτωση…</div>

  <!-- sign-in (same Check Mate account as the three apps) -->
  <section class="auth" id="auth" hidden aria-label="Είσοδος"></section>

  <!-- home: shown only when signed in -->
  <section id="home" hidden style="width:100%;display:flex;flex-direction:column;align-items:center">
    <div class="greet" id="greet"></div>
    <div class="user"><span id="who"></span><button type="button" id="signout">Αποσύνδεση</button></div>

    <nav class="apps" aria-label="Εφαρμογές">
      <a class="app" href="/checkmate/checkmate.html">
        <img src="/checkmate/icons/icon-192.png" alt="">
        <span class="name">Check Mate</span>
      </a>
      <span class="sep" aria-hidden="true"></span>
      <a class="app" href="/checkmate/imerologio.html">
        <img src="/checkmate/icons/diary-192.png" alt="">
        <span class="name">Ημερολόγιο</span>
      </a>
      <span class="sep" aria-hidden="true"></span>
      <a class="app" href="/vctips/">
        <img src="/vctips/icons/icon-192.png" alt="">
        <span class="name">V.C. Tips</span>
      </a>
    </nav>

    <button class="install" id="installBtn">Εγκατάσταση στο κινητό</button>
    <p class="hint" id="iosHint">Για εγκατάσταση στο iPhone: πάτησε <b>Κοινοποίηση</b> και μετά <b>Προσθήκη στην οθόνη Αφετηρίας</b>.</p>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="/checkmate/firebase-config.js"></script>
<script>
(function(){
  /* lets the three apps show a "⌂ Suite" button when opened from here (see suite-back.js) */
  try { sessionStorage.setItem('cmSuite', '1'); } catch (e) {}

  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var ERR = {
    "auth/invalid-email":"Το email δεν είναι σωστό.",
    "auth/missing-password":"Γράψε τον κωδικό σου.",
    "auth/invalid-credential":"Λάθος email ή κωδικός.",
    "auth/invalid-login-credentials":"Λάθος email ή κωδικός.",
    "auth/wrong-password":"Λάθος email ή κωδικός.",
    "auth/user-not-found":"Λάθος email ή κωδικός.",
    "auth/user-disabled":"Ο λογαριασμός έχει απενεργοποιηθεί. Μίλησε με τον διαχειριστή.",
    "auth/too-many-requests":"Πολλές προσπάθειες. Περίμενε λίγο και δοκίμασε ξανά.",
    "auth/network-request-failed":"Δεν υπάρχει σύνδεση στο διαδίκτυο.",
    "auth/account-exists-with-different-credential":"Αυτό το email χρησιμοποιεί άλλο τρόπο εισόδου. Δοκίμασε «Συνέχεια με Google»."
  };
  var errText = function(e){ return ERR[e && e.code] || "Κάτι πήγε στραβά. Δοκίμασε ξανά."; };
  var googleSvg = `<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>`;

  function show(which){
    $('loading').hidden = which !== 'loading';
    $('auth').hidden = which !== 'auth';
    $('home').hidden = which !== 'home';
    document.body.classList.toggle('signin', which === 'auth');
  }

  var cfg = window.FIREBASE_CONFIG || {};
  if (!window.firebase || !cfg.apiKey) {
    $('loading').textContent = 'Δεν ήταν δυνατή η φόρτωση. Έλεγξε τη σύνδεση στο διαδίκτυο και ξαναδοκίμασε.';
    return;
  }
  firebase.initializeApp(cfg);
  var auth = firebase.auth();
  auth.languageCode = 'el';

  function showAuth(view, msg, email){
    view = view || 'login'; email = email || '';
    var note = msg ? '<div class="msg ' + (msg.ok ? 'ok' : 'err') + '" role="' + (msg.ok ? 'status' : 'alert') + '">' + esc(msg.text) + '</div>' : '';
    var html;
    if (view === 'reset') {
      html = '<p class="lead">Γράψε το email σου και θα σου στείλουμε σύνδεσμο για νέο κωδικό.</p>' +
        '<form id="f" novalidate style="display:flex;flex-direction:column;gap:12px">' +
        '<label>Email<input id="em" type="email" autocomplete="email" inputmode="email" required value="' + esc(email) + '"></label>' + note +
        '<button class="btn primary" type="submit">Αποστολή συνδέσμου</button>' +
        '<button class="link" type="button" data-view="login">← Πίσω στην είσοδο</button></form>';
    } else {
      html = '<p class="lead">Συνδέσου με τον λογαριασμό σου στο Check Mate.</p>' +
        '<form id="f" novalidate style="display:flex;flex-direction:column;gap:12px">' +
        '<label>Email<input id="em" type="email" autocomplete="email" inputmode="email" required value="' + esc(email) + '"></label>' +
        '<label>Κωδικός<input id="pw" type="password" autocomplete="current-password" required></label>' + note +
        '<button class="btn primary" type="submit">Είσοδος</button>' +
        '<button class="link" type="button" data-view="reset">Ξέχασα τον κωδικό</button></form>' +
        '<div class="or">ή</div>' +
        '<button type="button" class="btn google" id="g">' + googleSvg + ' Συνέχεια με Google</button>' +
        '<p class="foot">Δεν έχεις λογαριασμό; <a class="link" href="/checkmate/checkmate.html">Εγγραφή στο Check Mate</a></p>';
    }
    var box = $('auth'); box.innerHTML = html; show('auth');
    box.querySelectorAll('[data-view]').forEach(function(b){
      b.onclick = function(){ showAuth(b.dataset.view, null, ($('em') || {}).value || email); };
    });
    if ($('g')) $('g').onclick = google;
    $('f').onsubmit = async function(e){
      e.preventDefault();
      var em = ($('em').value || '').trim();
      var btn = this.querySelector('.primary'); btn.disabled = true;
      try {
        if (view === 'reset') {
          if (!em) throw { code: 'auth/invalid-email' };
          await auth.sendPasswordResetEmail(em);
          showAuth('login', { ok: true, text: 'Αν υπάρχει λογαριασμός με αυτό το email, θα λάβεις σύνδεσμο για νέο κωδικό. Κοίτα και στα ανεπιθύμητα.' }, em);
          return;
        }
        await auth.signInWithEmailAndPassword(em, $('pw').value || '');
      } catch (err) {
        showAuth(view, { text: errText(err) }, em);
      }
    };
    var first = box.querySelector(email ? '#pw' : '#em'); if (first) try { first.focus(); } catch (e) {}
  }

  async function google(){
    var provider = new firebase.auth.GoogleAuthProvider();
    try { await auth.signInWithPopup(provider); }
    catch (e) {
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) {
        try { await auth.signInWithRedirect(provider); return; } catch (e2) { e = e2; }
      }
      if (e && e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') showAuth('login', { text: errText(e) });
    }
  }

  $('signout').onclick = function(){ auth.signOut(); };

  auth.onAuthStateChanged(function(u){
    if (!u) { showAuth('login'); return; }
    $('who').textContent = u.displayName || u.email || '';
    show('home');
  });

  /* greeting + install */
  $('greet').textContent = new Date().toLocaleDateString('el-GR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  var deferred = null, ib = $('installBtn');
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e; if (!standalone) ib.style.display = 'block';
  });
  ib.addEventListener('click', function(){
    if (!deferred) return; deferred.prompt();
    deferred.userChoice.finally(function(){ deferred = null; ib.style.display = 'none'; });
  });
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone) $('iosHint').style.display = 'block';
})();
</script>
</body>
</html>
